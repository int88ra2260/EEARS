name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend test and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reservation-backend
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-minimum-thirty-two-characters-long
      CORS_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: reservation-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Run lint
        run: npm run lint

  frontend:
    name: Frontend test, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reservation-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: reservation-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify vocabulary banks
        run: npm run vocab:check

      - name: Run tests
        run: npm test -- --watchAll=false

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build
